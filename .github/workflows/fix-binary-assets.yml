name: Restore binary assets
on:
  push:
    branches: [main]
    paths: ['assets-b64/**', '.github/workflows/fix-binary-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Regenerate icons and index from git history
        run: |
          git show 09721632d891d5aef14a54494d324d887aff03bf:icons/icon-512.png > orig-512.png
          git show 09721632d891d5aef14a54494d324d887aff03bf:index.html > index-orig.html
          git show 09721632d891d5aef14a54494d324d887aff03bf:sw.js | sed 's/irish-tunes-tutor-v9/irish-tunes-tutor-v10/' > sw.js
          python3 - <<'PYEOF'
          import zlib, struct, math

          def read_png_bytes(data):
              pos = 8; idat = b''; w=h=ct=0
              while pos < len(data):
                  ln, typ = struct.unpack('>I4s', data[pos:pos+8]); pos += 8
                  chunk = data[pos:pos+ln]; pos += ln + 4
                  if typ == b'IHDR': w,h,bd,ct = struct.unpack('>IIBB', chunk[:10])
                  elif typ == b'IDAT': idat += chunk
                  elif typ == b'IEND': break
              raw = zlib.decompress(idat); nch = 4 if ct==6 else 3
              stride = w*nch; out = bytearray(h*stride); prev = bytearray(stride); p=0
              for y in range(h):
                  f = raw[p]; p+=1; line = bytearray(raw[p:p+stride]); p+=stride
                  if f==1:
                      for i in range(nch,stride): line[i]=(line[i]+line[i-nch])&255
                  elif f==2:
                      for i in range(stride): line[i]=(line[i]+prev[i])&255
                  elif f==3:
                      for i in range(stride):
                          a=line[i-nch] if i>=nch else 0
                          line[i]=(line[i]+((a+prev[i])>>1))&255
                  elif f==4:
                      for i in range(stride):
                          a=line[i-nch] if i>=nch else 0; b=prev[i]; c=prev[i-nch] if i>=nch else 0
                          pp=a+b-c; pa,pb,pc=abs(pp-a),abs(pp-b),abs(pp-c)
                          pr=a if (pa<=pb and pa<=pc) else (b if pb<=pc else c)
                          line[i]=(line[i]+pr)&255
                  out[y*stride:(y+1)*stride]=line; prev=line
              return w,h,nch,bytes(out)

          def write_png(path, w, h, rgb_rows):
              def chunk(typ, data):
                  c = typ + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(r) for r in rgb_rows)
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(raw, 9))
              png += chunk(b'IEND', b'')
              open(path, 'wb').write(png)

          def is_dark(p): return p[0] < 70 and p[1] < 70 and p[2] < 70

          src = open('orig-512.png','rb').read()
          w,h,nch,px = read_png_bytes(src)
          assert (w,h,nch) == (512,512,3)
          CX = CY = 255.5
          rows = []
          for y in range(h):
              row = bytearray(w*3)
              for x in range(w):
                  o = (y*w+x)*3
                  p = (px[o], px[o+1], px[o+2])
                  d = math.hypot(x-CX, y-CY)
                  if d >= 262: continue
                  if is_dark(p): continue
                  ro = x*3
                  row[ro:ro+3] = bytes(p)
              rows.append(bytes(row))
          write_png('icons/icon-512.png', 512, 512, rows)
          o=(380*512+120)*3
          _,_,_,px2 = read_png_bytes(open('icons/icon-512.png','rb').read())
          assert tuple(px2[o:o+3]) == (251,182,93)

          def sample(u, v):
              u = min(max(u,0.0), 511.0); v = min(max(v,0.0), 511.0)
              x0, y0 = int(u), int(v)
              x1, y1 = min(x0+1,511), min(y0+1,511)
              fx, fy = u-x0, v-y0
              return [int((rows[y0][x0*3+c]*(1-fx)+rows[y0][x1*3+c]*fx)*(1-fy)
                       + (rows[y1][x0*3+c]*(1-fx)+rows[y1][x1*3+c]*fx)*fy) for c in range(3)]

          rows192 = []
          for y in range(192):
              row = bytearray()
              v = (y+0.5)*512/192 - 0.5
              for x in range(192):
                  p = sample((x+0.5)*512/192 - 0.5, v)
                  if is_dark(p): p = [0,0,0]
                  row += bytes(p)
              rows192.append(bytes(row))
          write_png('icons/icon-192.png', 192, 192, rows192)

          S = 512; sc = 0.66; off = (S - S*sc)/2
          rowsm = []
          for y in range(S):
              row = bytearray()
              for x in range(S):
                  sx = (x - off)/sc; sy = (y - off)/sc
                  if 0 <= sx <= 511 and 0 <= sy <= 511:
                      p = sample(sx, sy)
                      if is_dark(p): p = [0,0,0]
                      row += bytes(p)
                  else:
                      row += b'\x00\x00\x00'
              rowsm.append(bytes(row))
          write_png('icons/icon-512-maskable.png', S, S, rowsm)
          print('icons written')

          PYEOF
          python3 - <<'PYEOF'
          import re, base64, pathlib
          b64 = base64.b64encode(pathlib.Path('icons/icon-192.png').read_bytes()).decode()
          idx = pathlib.Path('index-orig.html').read_text(encoding='utf-8')
          pat = re.compile(r'(<link rel="(?:icon|apple-touch-icon)"[^>]*href=")data:image/png;base64,[A-Za-z0-9+/=]+(")')
          n = len(pat.findall(idx))
          assert n == 2, 'liens data-URI attendus: 2, trouves: %d' % n
          out = pat.sub(lambda m: m.group(1) + 'data:image/png;base64,' + b64 + m.group(2), idx)
          assert out != idx
          pathlib.Path('index.html').write_text(out, encoding='utf-8')
          print('index rebuilt, octets:', len(out))

          PYEOF
          python3 - <<'PYEOF'
          import base64, pathlib
          NL = chr(10)
          for src in ['icon-192.png','icon-512.png','icon-512-maskable.png']:
              data = pathlib.Path('icons/'+src).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', 'bad PNG: '+src
              b64 = base64.b64encode(data).decode()
              lines = [b64[i:i+76] for i in range(0, len(b64), 76)]
              pathlib.Path('assets-b64/'+src+'.b64').write_text(NL.join(lines) + NL)
              print('b64', src, len(data))

          PYEOF
      - name: Generate banner
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          # Banniere 1024x500 - icone a droite, halo emeraude, cercles orange pale,
          # typographie creme/vert lissee. Regeneration deterministe.
          import zlib, struct, sys, math

          def decode_png(path):
              d = open(path, 'rb').read()
              assert d[:8] == b'\x89PNG\r\n\x1a\n'
              pos, w, h, idat, ctype = 8, 0, 0, b'', None
              while pos < len(d):
                  ln = struct.unpack('>I', d[pos:pos+4])[0]
                  typ = d[pos+4:pos+8]
                  data = d[pos+8:pos+8+ln]
                  if typ == b'IHDR':
                      w, h, bd, ctype = struct.unpack('>IIBB', data[:10])
                  elif typ == b'IDAT':
                      idat += data
                  pos += 12 + ln
              assert bd == 8 and ctype == 2, (bd, ctype)
              raw = zlib.decompress(idat)
              stride = w * 3
              px = bytearray(w * h * 3)
              prev = bytearray(stride)
              p = 0
              for y in range(h):
                  f = raw[p]; p += 1
                  line = bytearray(raw[p:p+stride]); p += stride
                  if f == 1:
                      for i in range(3, stride): line[i] = (line[i] + line[i-3]) & 255
                  elif f == 2:
                      for i in range(stride): line[i] = (line[i] + prev[i]) & 255
                  elif f == 3:
                      for i in range(stride):
                          a = line[i-3] if i >= 3 else 0
                          line[i] = (line[i] + ((a + prev[i]) >> 1)) & 255
                  elif f == 4:
                      for i in range(stride):
                          a = line[i-3] if i >= 3 else 0
                          b = prev[i]; c = prev[i-3] if i >= 3 else 0
                          pp = a + b - c
                          pa, pb, pc = abs(pp-a), abs(pp-b), abs(pp-c)
                          pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                          line[i] = (line[i] + pr) & 255
                  px[y*stride:(y+1)*stride] = line
                  prev = line
              return w, h, bytes(px)

          def bilinear(src, sw, sh, x, y):
              x = max(0.0, min(sw - 1.001, x)); y = max(0.0, min(sh - 1.001, y))
              x0, y0 = int(x), int(y); dx, dy = x - x0, y - y0
              i = (y0 * sw + x0) * 3
              a = src[i:i+3]; b = src[i+3:i+6]; c = src[i+sw*3:i+sw*3+3]; dd = src[i+sw*3+3:i+sw*3+6]
              return tuple(
                  (a[k]*(1-dx)*(1-dy) + b[k]*dx*(1-dy) + c[k]*(1-dx)*dy + dd[k]*dx*dy)
                  for k in range(3))

          FONT = {
          'I': [".###.","..#..","..#..","..#..","..#..","..#..",".###."],
          'R': ["####.","#...#","#...#","####.","#.#..","#..#.","#...#"],
          'S': [".####","#....","#....",".###.","....#","....#","####."],
          'H': ["#...#","#...#","#...#","#####","#...#","#...#","#...#"],
          'T': ["#####","..#..","..#..","..#..","..#..","..#..","..#.."],
          'U': ["#...#","#...#","#...#","#...#","#...#","#...#",".###."],
          'N': ["#...#","##..#","##..#","#.#.#","#..##","#..##","#...#"],
          'E': ["#####","#....","#....","####.","#....","#....","#####"],
          'O': [".###.","#...#","#...#","#...#","#...#","#...#",".###."],
          }

          def draw_text(buf, W, H, text, x, y, unit_px, color, ls_u=1.3):
              k = 8
              n = len(text)
              mw = int((5*n + ls_u*(n-1)) * k) + 2
              mh = 7 * k
              mask = [0.0] * (mw * mh)
              for c, ch in enumerate(text):
                  x0 = int((5 + ls_u) * c * k)
                  for r in range(7):
                      row = FONT[ch][r]
                      for cc in range(5):
                          if row[cc] != '#':
                              continue
                          for yy in range(k):
                              for xx in range(k):
                                  mask[(r*k+yy)*mw + x0 + cc*k + xx] = 1.0
              tw = int((5*n + ls_u*(n-1)) * unit_px)
              th = int(7 * unit_px)
              for oy in range(th):
                  for ox in range(tw):
                      fx = (ox + 0.5) * mw / tw
                      fy = (oy + 0.5) * mh / th
                      x0 = int(fx); y0 = int(fy)
                      if 0 <= x0 < mw-1 and 0 <= y0 < mh-1:
                          dx, dy = fx - x0, fy - y0
                          i = y0*mw + x0
                          a = (mask[i]*(1-dx)*(1-dy) + mask[i+1]*dx*(1-dy)
                               + mask[i+mw]*(1-dx)*dy + mask[i+mw+1]*dx*dy)
                          if a > 0.003:
                              X, Y = x + ox, y + oy
                              if 0 <= X < W and 0 <= Y < H:
                                  j = (Y*W + X)*3
                                  for q in range(3):
                                      buf[j+q] = int(buf[j+q]*(1-a) + color[q]*a)

          W, H = 1024, 500
          buf = bytearray(W * H * 3)

          CX, CY = 903, 118
          LOGO_S, LOGO_X, LOGO_Y = 380, 612, 60

          def put(x, y, rgb):
              i = (y*W + x)*3
              buf[i:i+3] = bytes(rgb)

          for y in range(H):
              for x in range(0, W):
                  d2 = (x-CX)**2 + (y-CY)**2
                  if d2 < 260**2:
                      t = 1 - (d2 ** 0.5)/260
                      g = int(26 * t*t)
                      if g: buf[(y*W+x)*3+1] = g

          ORANGE = (255, 179, 102)
          for r in (170, 215, 262, 312, 364, 420, 480, 542):
              alpha = 0.30 * (1 - (r-170)/400)
              rr = r + 0.5
              steps = int(2*3.1416*rr)
              for s in range(steps):
                  a = 2*math.pi*s/steps
                  x = int(CX + rr*math.cos(a)); y = int(CY + rr*math.sin(a))
                  if 0 <= x < W and 0 <= y < H:
                      base = (y*W + x)*3
                      for k in range(3):
                          buf[base+k] = int(buf[base+k]*(1-alpha) + ORANGE[k]*alpha)
                      x2 = int(CX + (rr-1.4)*math.cos(a)); y2 = int(CY + (rr-1.4)*math.sin(a))
                      if 0 <= x2 < W and 0 <= y2 < H:
                          b2 = (y2*W + x2)*3
                          for k in range(3):
                              buf[b2+k] = int(buf[b2+k]*(1-alpha) + ORANGE[k]*alpha)

          iw, ih, ipx = decode_png('icons/icon-512.png')
          sc = LOGO_S / iw
          for y in range(LOGO_S):
              for x in range(LOGO_S):
                  r, g, b = bilinear(ipx, iw, ih, x/sc, y/sc)
                  X, Y = LOGO_X + x, LOGO_Y + y
                  if 0 <= X < W and 0 <= Y < H:
                      i = (Y*W + X)*3
                      buf[i] = int(r); buf[i+1] = int(g); buf[i+2] = int(b)

          CREME, VERT = (240, 233, 220), (22, 155, 98)
          draw_text(buf, W, H, "IRISH", 76, 108, 13, CREME, 1.4)
          draw_text(buf, W, H, "TUNES", 76, 226, 13, CREME, 1.4)
          for x in range(76, 76 + 5*13*5 + 4*8):
              for t in range(3):
                  put(x, 350+t, VERT); put(x, 356+t, VERT)
          draw_text(buf, W, H, "TUTOR", 76, 376, 10, VERT, 1.3)

          def chunk(t, data):
              return struct.pack('>I', len(data)) + t + data + struct.pack('>I', zlib.crc32(t + data) & 0xffffffff)

          strides = []
          for y in range(H):
              strides.append(b'\x00' + bytes(buf[y*W*3:(y+1)*W*3]))
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 2, 0, 0, 0)) \
                + chunk(b'IDAT', zlib.compress(b''.join(strides), 9)) + chunk(b'IEND', b'')
          open('banniere-1024x500.png', 'wb').write(png)
          import hashlib
          md5 = hashlib.md5(open('banniere-1024x500.png','rb').read()).hexdigest()
          assert md5 == '79a8ecfaf1493f7ff96fe6fbe51aa136', 'banner md5 mismatch: ' + md5
          print('banner written', md5)



          PYEOF
      - name: Commit binary assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch tmp-encoding-test.bin
          git add index.html sw.js icons/icon-192.png icons/icon-512.png icons/icon-512-maskable.png assets-b64/icon-192.png.b64 assets-b64/icon-512.png.b64 assets-b64/icon-512-maskable.png.b64 banniere-1024x500.png
          git commit -m "Banniere raffinie + icones fond noir (26 oct, v5)" || echo "nothing to commit"
          git push
