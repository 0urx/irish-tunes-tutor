[{"type":"text","text":"successfully downloaded text file (SHA: d6276fa4bbab80143ef195a134d54bd1dcc6025c)"},{"type":"resource","resource":{"uri":"repo://0urx/irish-tunes-tutor/sha/09721632d891d5aef14a54494d324d887aff03bf/contents/.github/workflows/fix-binary-assets.yml","mimeType":"text/plain; charset=utf-8","text":"name: Restore binary assets\non:\n  push:\n    branches: [main]\n    paths: ['assets-b64/**', '.github/workflows/fix-binary-assets.yml']\n  workflow_dispatch:\npermissions:\n  contents: write\njobs:\n  decode-and-commit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Decode base64 assets to exact binary PNG files\n        run: |\n          python3 - <<'PYEOF'\n          import base64, pathlib\n          mapping = {\n            'assets-b64/icon-192.png.b64': 'icons/icon-192.png',\n            'assets-b64/icon-512.png.b64': 'icons/icon-512.png',\n            'assets-b64/icon-512-maskable.png.b64': 'icons/icon-512-maskable.png',\n            'assets-b64/banniere-1024x500.png.b64': 'banniere-1024x500.png',\n          }\n          for src, dst in mapping.items():\n            data = base64.b64decode(pathlib.Path(src).read_text())\n            assert data[:8] == b'\\x89PNG\\r\\n\\x1a\\n', 'bad PNG signature: ' + dst\n            pathlib.Path(dst).write_bytes(data)\n            print('wrote', dst, len(data), 'bytes')\n          PYEOF\n      - name: Commit binary assets\n        run: |\n          git config user.name \"github-actions[bot]\"\n          git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n          git rm -f --ignore-unmatch tmp-encoding-test.bin\n          git add icons/icon-192.png icons/icon-512.png icons/icon-512-maskable.png banniere-1024x500.png\n          git commit -m \"Banniere 1024x500 assortie aux icones utilisateur (21 oct, 18h)\" || echo \"nothing to commit\"\n          git push\n"}}]