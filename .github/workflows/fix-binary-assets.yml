name: Restore binary assets
on:
  push:
    branches: [main]
    paths: ['assets-b64/**', '.github/workflows/fix-binary-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 assets to exact binary PNG files
        run: |
          python3 - <<'PYEOF'
          import base64, pathlib
          mapping = {
            'assets-b64/icon-192.png.b64': 'icons/icon-192.png',
            'assets-b64/icon-512.png.b64': 'icons/icon-512.png',
            'assets-b64/icon-512-maskable.png.b64': 'icons/icon-512-maskable.png',
            'assets-b64/banniere-1024x500.png.b64': 'banniere-1024x500.png',
          }
          for src, dst in mapping.items():
            data = base64.b64decode(pathlib.Path(src).read_text())
            assert data[:8] == b'\x89PNG\r\n\x1a\n', 'bad PNG signature: ' + dst
            pathlib.Path(dst).write_bytes(data)
            print('wrote', dst, len(data), 'bytes')
          PYEOF
      - name: Commit binary assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch tmp-encoding-test.bin
          git add icons/icon-192.png icons/icon-512.png icons/icon-512-maskable.png banniere-1024x500.png
          git commit -m "Icônes restaurées depuis assets-b64 (capture : whistle orange, un trou, spirale verte)" || echo "nothing to commit"
          git push
