name: Restore binary assets
on:
  push:
    branches: [main]
    paths: ['assets-b64/**', '.github/workflows/fix-binary-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Regenerate icons and index from git history
        run: |
          git show 09721632d891d5aef14a54494d324d887aff03bf:icons/icon-512.png > orig-512.png
          git show 09721632d891d5aef14a54494d324d887aff03bf:index.html > index-orig.html
          git show 09721632d891d5aef14a54494d324d887aff03bf:sw.js | sed 's/irish-tunes-tutor-v9/irish-tunes-tutor-v12/' > sw.js
          python3 - <<'PYEOF'
          import zlib, struct, math

          def read_png_bytes(data):
              pos = 8; idat = b''; w=h=ct=0
              while pos < len(data):
                  ln, typ = struct.unpack('>I4s', data[pos:pos+8]); pos += 8
                  chunk = data[pos:pos+ln]; pos += ln + 4
                  if typ == b'IHDR': w,h,bd,ct = struct.unpack('>IIBB', chunk[:10])
                  elif typ == b'IDAT': idat += chunk
                  elif typ == b'IEND': break
              raw = zlib.decompress(idat); nch = 4 if ct==6 else 3
              stride = w*nch; out = bytearray(h*stride); prev = bytearray(stride); p=0
              for y in range(h):
                  f = raw[p]; p+=1; line = bytearray(raw[p:p+stride]); p+=stride
                  if f==1:
                      for i in range(nch,stride): line[i]=(line[i]+line[i-nch])&255
                  elif f==2:
                      for i in range(stride): line[i]=(line[i]+prev[i])&255
                  elif f==3:
                      for i in range(stride):
                          a=line[i-nch] if i>=nch else 0
                          line[i]=(line[i]+((a+prev[i])>>1))&255
                  elif f==4:
                      for i in range(stride):
                          a=line[i-nch] if i>=nch else 0; b=prev[i]; c=prev[i-nch] if i>=nch else 0
                          pp=a+b-c; pa,pb,pc=abs(pp-a),abs(pp-b),abs(pp-c)
                          pr=a if (pa<=pb and pa<=pc) else (b if pb<=pc else c)
                          line[i]=(line[i]+pr)&255
                  out[y*stride:(y+1)*stride]=line; prev=line
              return w,h,nch,bytes(out)

          def write_png(path, w, h, rgb_rows):
              def chunk(typ, data):
                  c = typ + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(r) for r in rgb_rows)
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(raw, 9))
              png += chunk(b'IEND', b'')
              open(path, 'wb').write(png)

          def is_dark(p): return p[0] < 70 and p[1] < 70 and p[2] < 70

          src = open('orig-512.png','rb').read()
          w,h,nch,px = read_png_bytes(src)
          assert (w,h,nch) == (512,512,3)
          CX = CY = 255.5
          rows = []
          for y in range(h):
              row = bytearray(w*3)
              for x in range(w):
                  o = (y*w+x)*3
                  p = (px[o], px[o+1], px[o+2])
                  d = math.hypot(x-CX, y-CY)
                  if d >= 262: continue
                  if is_dark(p): continue
                  ro = x*3
                  row[ro:ro+3] = bytes(p)
              rows.append(bytes(row))
          write_png('icons/icon-512.png', 512, 512, rows)
          o=(380*512+120)*3
          _,_,_,px2 = read_png_bytes(open('icons/icon-512.png','rb').read())
          assert tuple(px2[o:o+3]) == (251,182,93)

          def sample(u, v):
              u = min(max(u,0.0), 511.0); v = min(max(v,0.0), 511.0)
              x0, y0 = int(u), int(v)
              x1, y1 = min(x0+1,511), min(y0+1,511)
              fx, fy = u-x0, v-y0
              return [int((rows[y0][x0*3+c]*(1-fx)+rows[y0][x1*3+c]*fx)*(1-fy)
                       + (rows[y1][x0*3+c]*(1-fx)+rows[y1][x1*3+c]*fx)*fy) for c in range(3)]

          rows192 = []
          for y in range(192):
              row = bytearray()
              v = (y+0.5)*512/192 - 0.5
              for x in range(192):
                  p = sample((x+0.5)*512/192 - 0.5, v)
                  if is_dark(p): p = [0,0,0]
                  row += bytes(p)
              rows192.append(bytes(row))
          write_png('icons/icon-192.png', 192, 192, rows192)

          S = 512; sc = 0.66; off = (S - S*sc)/2
          rowsm = []
          for y in range(S):
              row = bytearray()
              for x in range(S):
                  sx = (x - off)/sc; sy = (y - off)/sc
                  if 0 <= sx <= 511 and 0 <= sy <= 511:
                      p = sample(sx, sy)
                      if is_dark(p): p = [0,0,0]
                      row += bytes(p)
                  else:
                      row += b'\x00\x00\x00'
              rowsm.append(bytes(row))
          write_png('icons/icon-512-maskable.png', S, S, rowsm)
          print('icons written')

          PYEOF
          python3 - <<'PYEOF'
          import re, base64, pathlib
          b64 = base64.b64encode(pathlib.Path('icons/icon-192.png').read_bytes()).decode()
          idx = pathlib.Path('index-orig.html').read_text(encoding='utf-8')
          pat = re.compile(r'(<link rel="(?:icon|apple-touch-icon)"[^>]*href=")data:image/png;base64,[A-Za-z0-9+/=]+(")')
          n = len(pat.findall(idx))
          assert n == 2, 'liens data-URI attendus: 2, trouves: %d' % n
          out = pat.sub(lambda m: m.group(1) + 'data:image/png;base64,' + b64 + m.group(2), idx)
          assert out != idx
          pathlib.Path('index.html').write_text(out, encoding='utf-8')
          print('index rebuilt, octets:', len(out))

          PYEOF
          python3 - <<'PYEOF'
          import base64, pathlib
          NL = chr(10)
          for src in ['icon-192.png','icon-512.png','icon-512-maskable.png']:
              data = pathlib.Path('icons/'+src).read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', 'bad PNG: '+src
              b64 = base64.b64encode(data).decode()
              lines = [b64[i:i+76] for i in range(0, len(b64), 76)]
              pathlib.Path('assets-b64/'+src+'.b64').write_text(NL.join(lines) + NL)
              print('b64', src, len(data))

          PYEOF
      - name: Patch index i18n (bouton Poursuivre et Terminer)
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('index.html')
          t = p.read_text(encoding='utf-8')
          old = "btn.textContent = last ? 'Terminer' : 'Poursuivre';"
          new = "btn.textContent = last ? T('Terminer') : T('Poursuivre →');"
          assert t.count(old) == 1, 'bouton introuvable: %d' % t.count(old)
          t = t.replace(old, new)
          subs = [
           ("'Poursuivre →': 'Continue →',", "'Poursuivre →': 'Continue →',\n        'Terminer': 'Finish',"),
           ("'Poursuivre →': 'Weiter →',", "'Poursuivre →': 'Weiter →',\n        'Terminer': 'Abschließen',"),
           ('"Poursuivre →": "Continua →",', '"Poursuivre →": "Continua →",\n        "Terminer": "Termina",'),
           ('"Poursuivre →": "Continuar →",', '"Poursuivre →": "Continuar →",\n        "Terminer": "Terminar",'),
           ('"Poursuivre →": "Doorgaan →",', '"Poursuivre →": "Doorgaan →",\n        "Terminer": "Afronden",'),
           ('"Poursuivre →": "Fortsett →",', '"Poursuivre →": "Fortsett →",\n        "Terminer": "Fullfør",'),
           ('"Poursuivre →": "Jatka →",', '"Poursuivre →": "Jatka →",\n        "Terminer": "Valmis",'),
           ('"Poursuivre →": "Συνέχιση →",', '"Poursuivre →": "Συνέχιση →",\n        "Terminer": "Ολοκλήρωση",'),
           ('"Poursuivre →": "Folytatás →",', '"Poursuivre →": "Folytatás →",\n        "Terminer": "Befejezés",'),
          ]
          for a, b in subs:
              assert t.count(a) == 1, 'introuvable: ' + a[:30]
              t = t.replace(a, b)
          p.write_text(t, encoding='utf-8')
          print('i18n poursuivre/terminer patched, octets:', len(t))

          PYEOF
      - name: Patch mic recognition (notes, arret auto, precision)
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          # Patch de la reconnaissance audio : detection centree sur chaque note,
          # arret automatique des que le systeme est sur de lui, pourcentage de
          # precision calibre. Applique a index.html (celui reconstruit par le
          # workflow depuis l historique).
          import pathlib

          p = pathlib.Path('index.html')
          t = p.read_text(encoding='utf-8')
          orig_len = len(t)

          def rep(old, new, n=1):
              global t
              assert t.count(old) == n, 'attendu %d, trouve %d: %r' % (n, t.count(old), old[:60])
              t = t.replace(old, new)

          def cut(start_anchor, end_anchor, new_text, include_end=True):
              global t
              s = t.index(start_anchor)
              e = t.index(end_anchor, s)
              if include_end:
                  e += len(end_anchor)
                  if t[e] == '\n':
                      e += 1
              t = t[:s] + new_text + t[e:]

          # ---------------------------------------------------------------- i18n
          i18n = [
              ("'Terminer': 'Finish',", "'Terminer': 'Finish',", "'", [
                  (" note(s) perçue(s). Recherche automatique en direct…", " note(s) detected. Live automatic search…"),
                  ("Meilleur candidat : ", "Best candidate: "),
                  ("Reconnaissance automatique : tune identifié avec une confiance suffisante.", "Automatic recognition: tune identified with sufficient confidence."),
              ]),
              ("'Terminer': 'Abschließen',", "'Terminer': 'Abschließen',", "'", [
                  (" note(s) perçue(s). Recherche automatique en direct…", " Note(n) erkannt. Automatische Live-Suche…"),
                  ("Meilleur candidat : ", "Bester Kandidat: "),
                  ("Reconnaissance automatique : tune identifié avec une confiance suffisante.", "Automatische Erkennung: Melodie mit ausreichender Sicherheit identifiziert."),
              ]),
              ('"Terminer": "Termina",', '"Terminer": "Termina",', '"', [
                  (" note(s) perçue(s). Recherche automatique en direct…", " nota/e percepite. Ricerca automatica in tempo reale…"),
                  ("Meilleur candidat : ", "Miglior candidato: "),
                  ("Reconnaissance automatique : tune identifié avec une confiance suffisante.", "Riconoscimento automatico: melodia identificata con sufficiente affidabilità."),
              ]),
              ('"Terminer": "Terminar",', '"Terminer": "Terminar",', '"', [
                  (" note(s) perçue(s). Recherche automatique en direct…", " nota(s) percibidas. Búsqueda automática en directo…"),
                  ("Meilleur candidat : ", "Mejor candidato: "),
                  ("Reconnaissance automatique : tune identifié avec une confiance suffisante.", "Reconocimiento automático: melodía identificada con confianza suficiente."),
              ]),
              ('"Terminer": "Afronden",', '"Terminer": "Afronden",', '"', [
                  (" note(s) perçue(s). Recherche automatique en direct…", " noot/noten waargenomen. Automatische live zoektocht…"),
                  ("Meilleur candidat : ", "Beste kandidaat: "),
                  ("Reconnaissance automatique : tune identifié avec une confiance suffisante.", "Automatische herkenning: melodie met voldoende zekerheid geïdentificeerd."),
              ]),
              ('"Terminer": "Fullfør",', '"Terminer": "Fullfør",', '"', [
                  (" note(s) perçue(s). Recherche automatique en direct…", " tone(r) oppfattet. Automatisk direkte søk…"),
                  ("Meilleur candidat : ", "Beste kandidat: "),
                  ("Reconnaissance automatique : tune identifié avec une confiance suffisante.", "Automatisk gjenkjenning: melodi identifisert med tilstrekkelig sikkerhet."),
              ]),
              ('"Terminer": "Valmis",', '"Terminer": "Valmis",', '"', [
                  (" note(s) perçue(s). Recherche automatique en direct…", " havaittua nuottia. Automaattinen haku käynnissä…"),
                  ("Meilleur candidat : ", "Paras ehdokas: "),
                  ("Reconnaissance automatique : tune identifié avec une confiance suffisante.", "Automaattinen tunnistus: melodia tunnistettu riittävän varmasti."),
              ]),
              ('"Terminer": "Ολοκλήρωση",', '"Terminer": "Ολοκλήρωση",', '"', [
                  (" note(s) perçue(s). Recherche automatique en direct…", " νότα/νότες. Αυτόματη αναζήτηση σε πραγματικό χρόνο…"),
                  ("Meilleur candidat : ", "Καλύτερος υποψήφιος: "),
                  ("Reconnaissance automatique : tune identifié avec une confiance suffisante.", "Αυτόματη αναγνώριση: η μελωδία αναγνωρίστηκε με επαρκή βεβαιότητα."),
              ]),
              ('"Terminer": "Befejezés",', '"Terminer": "Befejezés",', '"', [
                  (" note(s) perçue(s). Recherche automatique en direct…", " észlelt hang. Automatikus élő keresés…"),
                  ("Meilleur candidat : ", "Legjobb jelölt: "),
                  ("Reconnaissance automatique : tune identifié avec une confiance suffisante.", "Automatikus felismerés: a dallam elegendő bizonyossággal azonosítva."),
              ]),
          ]
          for anchor, line, q, entries in i18n:
              assert t.count(anchor) == 1, anchor
              add = line + '\n        '
              add += ('\n        ').join(q + k + q + ': ' + q + v + q + ',' for k, v in entries)
              t = t.replace(anchor, add)

          # ---------------------------------------------------------------- micState
          rep(
              "    var micState = { stream: null, ctx: null, raf: 0, midis: [], hold: null, holdCount: 0, recent: [], cand: null, candCount: 0 };",
              "    var micState = { stream: null, ctx: null, raf: 0, midis: [], hold: null, holdCount: 0, recent: [], cand: null, candCount: 0, notePitches: [], liveStreak: 0 };"
          )
          rep(
              "        micState.midis = []; micState.hold = null; micState.holdCount = 0; micState.recent = []; micState.cand = null; micState.candCount = 0;",
              "        micState.midis = []; micState.hold = null; micState.holdCount = 0; micState.recent = []; micState.cand = null; micState.candCount = 0;\n        micState.notePitches = []; micState.liveStreak = 0;"
          )

          # ---------------------------------------------------------------- autoCorrelate
          cut('    function autoCorrelate(buf, sampleRate) {', '    var micState', '''    /* Détection de hauteur par autocorrélation (70 à 1000 Hz).
               * Renvoie { f, q } : fréquence interpolée au dixième de frame
               * près (parabole sur le pic choisi) et qualité de périodicité
               * (corrélation normale du pic). q < 0,5 = frame non exploitable
               * (bruit, attaque, souffle) : la note ne se fonde plus dessus. */
              function autoCorrelate(buf, sampleRate) {
                var SIZE = buf.length, rms = 0, i;
                for (i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
                rms = Math.sqrt(rms / SIZE);
                if (rms < 0.006) return null;
                var MIN_P = Math.floor(sampleRate / 1000);
                var MAX_P = Math.floor(sampleRate / 70);
                var r = new Float32Array(MAX_P + 1);
                for (var T = MIN_P; T <= MAX_P; T++) {
                  var sum = 0, norm = 0;
                  for (i = 0; i < SIZE - T; i++) {
                    sum += buf[i] * buf[i + T];
                    norm += buf[i] * buf[i];
                  }
                  r[T] = sum / (norm + 1e-9);
                }
                var bestT = -1, bestV = 0;
                for (T = MIN_P; T <= MAX_P; T++) {
                  if (r[T] > bestV) { bestV = r[T]; bestT = T; }
                }
                if (bestT < 0 || bestV < 0.25) return null;
                /* Anti-octave : on retient le premier pic de corrélation
                 * suffisamment fort (la fondamentale est le pic le plus
                 * court ; les multiples donnent des octaves trop graves). */
                var thresh = bestV * 0.85;
                var chosen = bestT;
                for (T = MIN_P; T <= MAX_P; T++) {
                  var prevV = T > MIN_P ? r[T - 1] : 0;
                  var nextV = T < MAX_P ? r[T + 1] : 0;
                  if (r[T] > thresh && r[T] >= prevV && r[T] >= nextV) { chosen = T; break; }
                }
                /* Interpolation parabolique du pic : sous 300 Hz, un frame
                 * d'écart à 44,1 kHz vaut jusqu'à 30 cents ; la parabole
                 * ramène l'erreur à quelques cents par note. */
                var y0 = chosen > MIN_P ? r[chosen - 1] : r[chosen];
                var y2 = chosen < MAX_P ? r[chosen + 1] : r[chosen];
                var denom = y0 - 2 * r[chosen] + y2;
                var shift = denom !== 0 ? 0.5 * (y0 - y2) / denom : 0;
                if (shift < -0.5) shift = -0.5;
                if (shift > 0.5) shift = 0.5;
                return { f: sampleRate / (chosen + shift), q: bestV };
              }

          ''', include_end=False)

          # ---------------------------------------------------------------- helpers
          rep("    function startIdentify() {", '''    /* Recherche partagée (arrêt manuel et vérification en direct) :
               * renvoie les candidats triés par score brut décroissant,
               * l'objet tune attaché à chacun. */
              function runContourSearch(midis) {
                var q = [];
                for (var i = 1; i < midis.length && q.length < MAX_QUERY_IV; i++) {
                  q.push(midis[i] - midis[i - 1]);
                }
                var corpus = buildContours();
                var bestByTune = {};
                for (var k = 0; k < corpus.length; k++) {
                  var s = contourMatch(q, corpus[k].iv);
                  if (s <= 0) continue;
                  var tid = corpus[k].tune.id || corpus[k].tune.name;
                  if (bestByTune[tid] === undefined || s > bestByTune[tid]) bestByTune[tid] = s;
                }
                var results = [];
                Object.keys(bestByTune).forEach(function (tid) { results.push({ id: tid, score: bestByTune[tid] }); });
                var byId = {};
                corpus.forEach(function (e) { byId[e.tune.id || e.tune.name] = e.tune; });
                results.sort(function (a, b) { return b.score - a.score; });
                results.forEach(function (r) { r.t = byId[r.id]; });
                return results;
              }

              /* Pourcentage de précision calibré : 0 % équivaut au score
               * d'un contour aléatoire (0,5 brut), 100 % à la coïncidence
               * exacte de tous les intervalles. Le score brut affichait des
               * « 55 % » trompeurs sur des bruits quelconques. */
              function precisionPct(score) {
                var c = (score - 0.5) / 0.5;
                if (c < 0) c = 0;
                if (c > 1) c = 1;
                return Math.round(c * 100);
              }

              function startIdentify() {''')

          # ---------------------------------------------------------------- carte d'ecoute
          rep(
              "        var tips = document.createElement('div');\n        tips.className = 'listen-sub';",
              """        var liveBest = document.createElement('div');
                  liveBest.className = 'listen-sub';
                  liveBest.id = 'listenBest';
                  var tips = document.createElement('div');
                  tips.className = 'listen-sub';"""
          )
          rep(
              "        card.appendChild(head); card.appendChild(cnt); card.appendChild(notesDiv);",
              "        card.appendChild(head); card.appendChild(cnt); card.appendChild(notesDiv);\n        card.appendChild(liveBest);"
          )
          rep(
              "        list.appendChild(card);\n",
              """        list.appendChild(card);
                  /* Prépare la bibliothèque de contours dès le début de
                   * l'écoute : la vérification en direct n'attendra pas. */
                  setTimeout(function () { try { buildContours(); } catch (e2) {} }, 60);
          """
          )

          # ---------------------------------------------------------------- frame + auto-check
          frame_start = t.index('        function frame() {')
          _end_anchor = chr(10) + '        micState.raf = requestAnimationFrame(frame);' + chr(10)
          frame_end = t.index(_end_anchor, frame_start) + len(_end_anchor)
          new_frame = '''        /* Vérification en direct : dès que la bibliothèque est
                   * prête, chaque note confirmée déclenche (au plus toutes
                   * les 1,5 s) une recherche ; un candidat nettement détaché
                   * du suivant deux fois de suite arrête l'écoute et affiche
                   * les résultats sans intervention manuelle. */
                  var lastAutoCheck = 0;
                  function liveAutoCheck() {
                    var now = Date.now();
                    if (now - lastAutoCheck < 1500) return;
                    if (micState.midis.length < 8 || !CONTOUR_CACHE || !CONTOUR_CACHE.length) return;
                    lastAutoCheck = now;
                    var res = runContourSearch(micState.midis);
                    if (!res.length || !res[0].t) { micState.liveStreak = 0; return; }
                    var best = res[0];
                    var second = res.length > 1 ? res[1].score : 0;
                    var bestEl = $('listenBest');
                    if (bestEl) bestEl.textContent = T('Meilleur candidat : ') + best.t.name + ' — ' + precisionPct(best.score) + T(' %');
                    if (best.score >= 0.80 && best.score - second >= 0.05) {
                      micState.liveStreak += 1;
                      if (micState.liveStreak >= 2) { stopIdentify(true); return; }
                    } else {
                      micState.liveStreak = 0;
                    }
                  }
                  function frame() {
                    analyser.getFloatTimeDomainData(buf);
                    var ac = autoCorrelate(buf, actx.sampleRate);
                    if (ac && ac.f > 0 && ac.q >= 0.5) {
                      /* Chaque frame fiable (note réellement tenue par
                       * l'instrument) alimente la médiane glissante ; les
                       * frames peu périodiques (bruit, transitoire
                       * d'attaque, souffle) sont écartées comme un silence :
                       * la détection se concentre sur les notes. */
                      micState.recent.push(69 + 12 * Math.log(ac.f / 440) / Math.LN2);
                      if (micState.recent.length > 3) micState.recent.shift();
                      var med = medianOf(micState.recent);
                      var midi = Math.round(med);
                      if (micState.hold === null) {
                        micState.hold = midi; micState.holdCount = 1; micState.notePitches = [med];
                        micState.cand = null; micState.candCount = 0;
                      } else if (midi === micState.hold) {
                        micState.holdCount++;
                        micState.notePitches.push(med);
                        micState.candCount = 0;
                      } else {
                        /* Candidat à la bascule : deux frames ET un écart
                         * franc de 0,55 demi-ton. La note confirmée est
                         * arrondie sur la médiane de toutes ses hauteurs
                         * stables, pas sur un instantané : chaque note est
                         * mesurée sur toute sa durée. */
                        if (midi === micState.cand) micState.candCount++;
                        else { micState.cand = midi; micState.candCount = 1; }
                        if (micState.candCount >= 2 && Math.abs(med - micState.hold) >= 0.55) {
                          var confirmed = Math.round(medianOf(micState.notePitches));
                          var last = micState.midis.length ? micState.midis[micState.midis.length - 1] : null;
                          if (last !== confirmed) micState.midis.push(confirmed);
                          micState.hold = midi; micState.holdCount = 1; micState.notePitches = [med];
                          micState.cand = null; micState.candCount = 0;
                          liveAutoCheck();
                        }
                      }
                      cnt.textContent = micState.midis.length + T(' note(s) perçue(s). Recherche automatique en direct…');
                      notesDiv.textContent = micState.midis.slice(-12).map(noteName).join('  ');
                    } else if (micState.recent.length) {
                      /* Silence : la mémoire glissante se vide pour ne pas
                       * mélanger deux notes séparées par un repos. */
                      micState.recent.shift();
                    }
                    if (micState.stream || micState.ctx) micState.raf = requestAnimationFrame(frame);
                  }
                  micState.raf = requestAnimationFrame(frame);
          '''
          t = t[:frame_start] + new_frame + t[frame_end:]

          # ---------------------------------------------------------------- stopIdentify
          cut('    function stopIdentify() {', '    function toggleIdentify() {', '''    function stopIdentify(auto) {
                if (micState.raf) cancelAnimationFrame(micState.raf);
                micState.raf = 0;
                /* Dernière note en cours à l'arrêt : confirmée dès deux
                 * frames, au même titre qu'une bascule (symétrie avec le
                 * suivi temps réel), sur la médiane de ses hauteurs. */
                if (micState.hold !== null && micState.holdCount >= 2) {
                  var confirmed = Math.round(medianOf(micState.notePitches.length ? micState.notePitches : [micState.hold]));
                  var last = micState.midis.length ? micState.midis[micState.midis.length - 1] : null;
                  if (last !== confirmed) micState.midis.push(confirmed);
                }
                if (micState.stream) { micState.stream.getTracks().forEach(function (tr) { tr.stop(); }); micState.stream = null; }
                if (micState.ctx) { micState.ctx.close(); micState.ctx = null; }
                $('micBtnLabel').textContent = T('Identifier un tune');
                $('micBtn').classList.remove('listening');

                var midis = micState.midis;
                if (midis.length < 4) {
                  setStatus('Pas assez de notes perçues. Veuillez rejouer quelques mesures plus près du micro.');
                  return;
                }
                setStatus(auto
                  ? 'Reconnaissance automatique : tune identifié avec une confiance suffisante.'
                  : 'Analyse du contour joué et recherche dans la bibliothèque...');
                /* Laisse le navigateur afficher le message avant le calcul. */
                setTimeout(function () {
                  var results = runContourSearch(midis);
                  var top = results.slice(0, 3).filter(function (r) { return r.score >= 0.55; });
                  var list = $('tuneList');
                  removeMySubTabs();
                  list.innerHTML = '';
                  if (!top.length) {
                    setStatus('Aucun tune reconnu avec certitude. Veuillez essayer en jouant le début du tune, dans une pièce calme.');
                    return;
                  }
                  setStatus(auto
                    ? 'Reconnaissance automatique : tune identifié avec une confiance suffisante. Fonction bêta : cliquez sur un tune pour ouvrir sa partition.'
                    : 'Fonction bêta : tunes les plus proches de ce qui a été joué au micro. Cliquez sur un tune pour ouvrir sa partition.');
                  top.forEach(function (r, idx) {
                    var li = document.createElement('li');
                    li.className = 'tune-card';
                    var left = document.createElement('div');
                    var name = document.createElement('div');
                    name.className = 'tune-name';
                    name.textContent = (idx + 1) + T('. ') + r.t.name;
                    var type = document.createElement('div');
                    type.className = 'tune-type';
                    type.textContent = r.t.type || '';
                    var src = document.createElement('div');
                    src.className = 'tune-src';
                    src.textContent = r.t.source || '';
                    var score = document.createElement('div');
                    score.className = 'match-score';
                    score.textContent = T('Correspondance : ') + precisionPct(r.score) + T(' %');
                    left.appendChild(name); left.appendChild(type); left.appendChild(src); left.appendChild(score);
                    li.appendChild(left);
                    /* Toute la carte est cliquable : pas de bouton « Ouvrir ». */
                    li.addEventListener('click', function () { stopAll(); openTune(r.t); });
                    list.appendChild(li);
                  });
                }, 30);
              }

          ''', include_end=False)

          p.write_text(t, encoding='utf-8')
          print('patch mic applique:', orig_len, '->', len(t), 'caracteres')

