name: Restore binary assets
on:
  push:
    branches: [main]
    paths: ['assets-b64/**', '.github/workflows/fix-binary-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Regenerate icons from original in git history
        run: |
          git show 09721632d891d5aef14a54494d324d887aff03bf:icons/icon-512.png > orig-512.png
          python3 - <<'PYEOF'
          import zlib, struct, math

          def read_png_bytes(data):
              pos = 8; idat = b''; w=h=ct=0
              while pos < len(data):
                  ln, typ = struct.unpack('>I4s', data[pos:pos+8]); pos += 8
                  chunk = data[pos:pos+ln]; pos += ln + 4
                  if typ == b'IHDR': w,h,bd,ct = struct.unpack('>IIBB', chunk[:10])
                  elif typ == b'IDAT': idat += chunk
                  elif typ == b'IEND': break
              raw = zlib.decompress(idat); nch = 4 if ct==6 else 3
              stride = w*nch; out = bytearray(h*stride); prev = bytearray(stride); p=0
              for y in range(h):
                  f = raw[p]; p+=1; line = bytearray(raw[p:p+stride]); p+=stride
                  if f==1:
                      for i in range(nch,stride): line[i]=(line[i]+line[i-nch])&255
                  elif f==2:
                      for i in range(stride): line[i]=(line[i]+prev[i])&255
                  elif f==3:
                      for i in range(stride):
                          a=line[i-nch] if i>=nch else 0
                          line[i]=(line[i]+((a+prev[i])>>1))&255
                  elif f==4:
                      for i in range(stride):
                          a=line[i-nch] if i>=nch else 0; b=prev[i]; c=prev[i-nch] if i>=nch else 0
                          pp=a+b-c; pa,pb,pc=abs(pp-a),abs(pp-b),abs(pp-c)
                          pr=a if (pa<=pb and pa<=pc) else (b if pb<=pc else c)
                          line[i]=(line[i]+pr)&255
                  out[y*stride:(y+1)*stride]=line; prev=line
              return w,h,nch,bytes(out)

          def write_png(path, w, h, rgb_rows):
              def chunk(typ, data):
                  c = typ + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              raw = b''.join(b'\x00' + bytes(r) for r in rgb_rows)
              png = b'\x89PNG\r\n\x1a\n'
              png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              png += chunk(b'IDAT', zlib.compress(raw, 9))
              png += chunk(b'IEND', b'')
              open(path, 'wb').write(png)

          def is_dark(p): return p[0] < 70 and p[1] < 70 and p[2] < 70

          src = open('orig-512.png','rb').read()
          w,h,nch,px = read_png_bytes(src)
          assert (w,h,nch) == (512,512,3)
          CX = CY = 255.5
          rows = []
          for y in range(h):
              row = bytearray(w*3)
              for x in range(w):
                  o = (y*w+x)*3
                  p = (px[o], px[o+1], px[o+2])
                  d = math.hypot(x-CX, y-CY)
                  if d >= 262: continue
                  if is_dark(p): continue
                  ro = x*3
                  row[ro:ro+3] = bytes(p)
              rows.append(bytes(row))
          write_png('icons/icon-512.png', 512, 512, rows)
          o=(380*512+120)*3
          _,_,_,px2 = read_png_bytes(open('icons/icon-512.png','rb').read())
          assert tuple(px2[o:o+3]) == (251,182,93)

          def sample(u, v):
              u = min(max(u,0.0), 511.0); v = min(max(v,0.0), 511.0)
              x0, y0 = int(u), int(v)
              x1, y1 = min(x0+1,511), min(y0+1,511)
              fx, fy = u-x0, v-y0
              return [int((rows[y0][x0*3+c]*(1-fx)+rows[y0][x1*3+c]*fx)*(1-fy)
                       + (rows[y1][x0*3+c]*(1-fx)+rows[y1][x1*3+c]*fx)*fy) for c in range(3)]

          rows192 = []
          for y in range(192):
              row = bytearray()
              v = (y+0.5)*512/192 - 0.5
              for x in range(192):
                  p = sample((x+0.5)*512/192 - 0.5, v)
                  if is_dark(p): p = [0,0,0]
                  row += bytes(p)
              rows192.append(bytes(row))
          write_png('icons/icon-192.png', 192, 192, rows192)

          S = 512; sc = 0.66; off = (S - S*sc)/2
          rowsm = []
          for y in range(S):
              row = bytearray()
              for x in range(S):
                  sx = (x - off)/sc; sy = (y - off)/sc
                  if 0 <= sx <= 511 and 0 <= sy <= 511:
                      p = sample(sx, sy)
                      if is_dark(p): p = [0,0,0]
                      row += bytes(p)
                  else:
                      row += b'\x00\x00\x00'
              rowsm.append(bytes(row))
          write_png('icons/icon-512-maskable.png', S, S, rowsm)
          print('icons written')

          PYEOF
          python3 - <<'PYEOF'
          import base64, pathlib
          for src in ['icon-192.png','icon-512.png','icon-512-maskable.png']:
            data = pathlib.Path('icons/'+src).read_bytes()
            assert data[:8] == b'PNG

', 'bad PNG: '+src
            b64 = base64.b64encode(data).decode()
            lines = [b64[i:i+76] for i in range(0, len(b64), 76)]
            pathlib.Path('assets-b64/'+src+'.b64').write_text('
'.join(lines) + '
')
            print('b64', src, len(data))
          PYEOF
      - name: Commit binary assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch tmp-encoding-test.bin
          git add icons/icon-192.png icons/icon-512.png icons/icon-512-maskable.png assets-b64/icon-192.png.b64 assets-b64/icon-512.png.b64 assets-b64/icon-512-maskable.png.b64
          git commit -m "Icones regenerees : fond noir pur, coins sans blanc (26 oct, v2)" || echo "nothing to commit"
          git push
